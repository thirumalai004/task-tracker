<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker (live)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#2f6fed; --ok:#1f9d55; --bad:#d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d222b; --text:#e8ebf1; --muted:#9099ab; --line:#2c3340; --accent:#6b9bff; --ok:#46c37b; --bad:#ff7a7a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:620px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:1.4rem; margin:0; }
  .badges { display:flex; gap:8px; font-size:.85rem; color:var(--muted); }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border:1px solid var(--line); border-radius:999px; background:var(--card); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .live .dot { background:var(--ok); }
  .down .dot { background:var(--bad); }
  form { display:flex; gap:8px; margin:20px 0 12px; }
  input[type=text] { flex:1; padding:10px 12px; font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); padding:8px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  li.new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 25%, var(--card)); } to { background:var(--card); } }
  li .title { flex:1; overflow-wrap:anywhere; }
  li.done .title { text-decoration:line-through; color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:24px; }
  .error { color:var(--bad); min-height:1.4em; font-size:.9rem; }
  footer { margin-top:20px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Task Tracker</h1>
    <div class="badges">
      <span id="conn" class="badge down"><span class="dot"></span><span id="connText">connecting...</span></span>
      <span class="badge"><span id="viewers">0</span> viewing</span>
    </div>
  </header>

  <form id="addForm">
    <input id="title" type="text" maxlength="200" placeholder="Add a task and press Enter" autocomplete="off" required>
    <button class="primary" type="submit">Add</button>
  </form>
  <div id="error" class="error" role="alert"></div>

  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>No tasks yet. Add one, or open this page in a second tab and watch it appear there.</div>

  <footer>Updates arrive live (Server-Sent Events). No refresh needed.</footer>
</main>

<script>
const list = document.getElementById('list');
const emptyMsg = document.getElementById('empty');
const errorBox = document.getElementById('error');
const connBox = document.getElementById('conn');
const connText = document.getElementById('connText');
const viewersBox = document.getElementById('viewers');

function showError(msg) { errorBox.textContent = msg || ''; }
function refreshEmpty() { emptyMsg.hidden = list.children.length > 0; }

function render(task, isNew) {
  let li = document.getElementById('task-' + task.id);
  if (!li) {
    li = document.createElement('li');
    li.id = 'task-' + task.id;
    li.innerHTML = '<input type="checkbox" aria-label="done"><span class="title"></span><button type="button">Delete</button>';
    li.querySelector('input').addEventListener('change', () => markDone(task.id));
    li.querySelector('button').addEventListener('click', () => removeTask(task.id));
    list.appendChild(li);
  }
  li.querySelector('.title').textContent = task.title;       // textContent: user text is never run as HTML
  li.classList.toggle('done', task.done);
  const box = li.querySelector('input');
  box.checked = task.done;
  box.disabled = task.done;
  if (isNew) { li.classList.remove('new'); void li.offsetWidth; li.classList.add('new'); }
  refreshEmpty();
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ('request failed (' + res.status + ')'));
  }
  return res.json();
}

async function loadAll() {
  try {
    const data = await api('/tasks');
    list.innerHTML = '';
    data.tasks.forEach(t => render(t, false));
    refreshEmpty();
  } catch (err) { showError(err.message); }
}

async function markDone(id) {
  try { showError(''); await api('/tasks/' + id + '/done', { method: 'PUT' }); }
  catch (err) { showError(err.message); loadAll(); }
}
async function removeTask(id) {
  try { showError(''); await api('/tasks/' + id, { method: 'DELETE' }); }
  catch (err) { showError(err.message); loadAll(); }
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('title');
  try {
    showError('');
    await api('/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
    input.value = '';
  } catch (err) { showError(err.message); }
});

// --- live updates ----------------------------------------------------
const source = new EventSource('/events');
source.onopen = () => {
  connBox.className = 'badge live';
  connText.textContent = 'live';
  loadAll();                       // catch up on anything missed while disconnected
};
source.onerror = () => {           // the browser reconnects by itself
  connBox.className = 'badge down';
  connText.textContent = 'reconnecting...';
};
source.addEventListener('task_added',   e => render(JSON.parse(e.data), true));
source.addEventListener('task_done',    e => render(JSON.parse(e.data), false));
source.addEventListener('task_deleted', e => {
  const li = document.getElementById('task-' + JSON.parse(e.data).id);
  if (li) li.remove();
  refreshEmpty();
});
source.addEventListener('viewers',      e => { viewersBox.textContent = JSON.parse(e.data).count; });
</script>
</body>
</html>
